    <!-- SPA GitHub Pages: decodifica la redirección de 404.html
         (/Portfolio_Personal/?/reportaje&perfil=periodista
          → /Portfolio_Personal/reportaje?perfil=periodista).
         Debe ir antes del <script type="module">, que es diferido. -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) { return s.replace(/~and~/g, '&'); })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
